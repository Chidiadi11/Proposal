<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virexa Navbar Demo</title>
  <link rel="stylesheet" href="/ALL.style.css" />
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <header class="navbar-header">
    <div class="nav-container">
      
      <!-- Logo -->
      <a href="#" class="nav-logo">Virexa</a>

      <!-- Navigation Links -->
      <nav class="nav-links">
        <a href="#" class="nav-item">How it Works</a>
        <a href="#" class="nav-item">Pricing</a>
        
        <!-- Features Dropdown (Optional/Static) -->
        <div class="dropdown-wrapper">
          <a href="#" class="nav-item">Features <i class="fa-solid fa-chevron-down nav-caret"></i></a>
        </div>

        <!-- Learn Dropdown (Matches Screenshot) -->
        <div class="dropdown-wrapper">
          <a href="#" class="nav-item active-dropdown-parent">Learn <i class="fa-solid fa-chevron-down nav-caret"></i></a>
          
          <!-- Dropdown Menu Box -->
          <div class="dropdown-menu">
            <a href="#" class="dropdown-link">
              <i class="fa-solid fa-book-open dropdown-icon"></i>
              <span>Blog</span>
            </a>
            <a href="#" class="dropdown-link">
              <i class="fa-solid fa-graduation-cap dropdown-icon"></i>
              <span>Youtube & Creator Academy</span>
            </a>
            <a href="#" class="dropdown-link">
              <i class="fa-solid fa-book dropdown-icon"></i>
              <span>Help Desk & Guides</span>
            </a>
            <a href="#" class="dropdown-link">
              <i class="fa-solid fa-circle-question dropdown-icon"></i>
              <span>FAQs</span>
            </a>
          </div>
        </div>

        <a href="#" class="nav-item">Affiliate Network</a>
      </nav>

      <!-- Right Actions -->
      <div class="nav-actions">
        <a href="#" class="lang-selector">EN <i class="fa-solid fa-chevron-down text-small"></i></a>
        <a href="#" class="login-btn">Log In</a>
        <a href="#" class="cta-btn">Start Selling</a>
      </div>

    </div>
  </header>

</body>
</html>
