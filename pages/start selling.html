<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Virexa</title>
  <!-- NOTE THE "../" BEFORE style.css TO FIND THE CSS IN THE ROOT FOLDER -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="selar-login-body">

  <!-- 1. Header Navigation -->
  <header class="virexa-header">
    <nav class="chi"> 
      <a href="../index.html">How It Works</a>
      <a href="/pages/Pricing.html">Pricing</a>
      <a href="/pages/Features.html">Features</a>
      <a href="/pages/Learn.html">Learn</a>
      <a href="/pages/Affiliate Network.html">Affiliate Network</a>
      
      <li class="nav-right-group">
        <a href="login.html">Log In</a>
        <a href="/pages/start selling.html" class="nav-cta-btn">Start Selling</a>
      </li>
    </nav>
  </header>

  <!-- 2. Main Area (Illustration + Card) -->
  <main class="login-main-container">
    
    <!-- Floating Illustration on the bottom-left -->
    <div class="bottom-left-illustration">
      <svg width="240" height="240" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 150 C 50 100, 150 100, 150 150 Z" fill="#93c5fd" opacity="0.3"/>
        <rect x="75" y="70" width="50" height="90" rx="10" fill="#2563eb"/>
        <rect x="80" y="75" width="40" height="70" rx="6" fill="#ffffff"/>
        <circle cx="100" cy="152" r="5" fill="#ffffff"/>
        <circle cx="100" cy="110" r="12" fill="#581cfa" opacity="0.2"/>
        <path d="M95 110 L105 110 M100 105 L100 115" stroke="#581cfa" stroke-width="2"/>
      </svg>
    </div>

    <!-- Centered Card -->
    <div class="selar-login-card">
      <h2>Create your Virexa account</h2>
      <p class="signup-prompt">Already have an account? <a href="#">Log in here.</a></p>

      <form class="selar-form">
        <div class="selar-input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="e.g. janesmith" required>
        </div>

        <div class="selar-input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. jane@example.com" required>
        </div>

        <div class="selar-input-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="e.g. Jane Smith" required>
        </div>

        <div class="selar-input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a strong password" required>
        </div>

        <button type="submit" class="selar-continue-btn">Create Account</button>
      </form>

      <div class="selar-divider">
        <span>or register with</span>
      </div>

      <!-- Social Logins -->
      <div class="social-login-group">
        <button class="social-btn">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="16">
          Register with Google
        </button>
        <button class="social-btn">
          <i class="fa-brands fa-x-twitter"></i>
          Register with X (or Twitter)
        </button>
        <button class="social-btn">
          <i class="fa-brands fa-facebook-f" style="color: #1877f2;"></i>
          Register with Facebook
        </button>
      </div>
    </div>

  </main>

</body>
</html>
